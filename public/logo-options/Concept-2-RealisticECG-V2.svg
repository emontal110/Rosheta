<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDarkConcept2V2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#081129" />
    </linearGradient>

    <linearGradient id="amberGoldC2V2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="emeraldGreenC2V2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="cyanNeonECGV2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Dedicated Glow Filter for Rx Symbol to make it POP -->
    <filter id="rxGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowECGV2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowC2V2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Full Bleed Square Background (NO inner frame box) -->
  <rect width="512" height="512" fill="url(#bgDarkConcept2V2)" />

  <circle cx="256" cy="256" r="165" fill="#10b981" opacity="0.14" filter="blur(30px)" />

  <g transform="translate(256, 256)" filter="url(#shadowC2V2)">
    <!-- Top Half Capsule (Golden Amber) -->
    <path d="M -56 -18 L -56 -118 A 56 56 0 0 1 56 -118 L 56 -18 Z" fill="url(#amberGoldC2V2)" />
    <!-- Top Glossy Reflection -->
    <path d="M -36 -124 A 40 40 0 0 1 16 -124" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.5" />

    <!-- Bottom Half Capsule (Emerald Green) -->
    <path d="M -56 18 L -56 118 A 56 56 0 0 0 56 118 L 56 18 Z" fill="url(#emeraldGreenC2V2)" />

    <!-- Sharp Dual-Spike Medical Monitor ECG Heartbeat Wave -->
    <path d="M -180 0 
             L -90 0 
             L -75 -40 
             L -60 30 
             L -40 -15 
             L -20 0 
             L 0 -85 
             L 25 45 
             L 45 -10 
             L 60 0 
             L 75 -35 
             L 90 20 
             L 180 0" 
          fill="none" 
          stroke="url(#cyanNeonECGV2)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glowECGV2)" />

    <circle cx="-180" cy="0" r="8" fill="#00f2fe" filter="url(#glowECGV2)" />
    <circle cx="180" cy="0" r="8" fill="#00f2fe" filter="url(#glowECGV2)" />

    <!-- FOREGROUND PROMINENT RX EMBLEM (Bold 3D Embossed White with Dark Contrast Outline & Glow) -->
    <g filter="url(#rxGlowFilter)">
      <!-- Outer Dark Contrast Stroke Outline for 3D Pop -->
      <g fill="none" stroke="#050b1a" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path d="M -22 -98 L -22 -48 M -22 -98 L -2 -98 C 13 -98 13 -73 -2 -73 L -22 -73 M -4 -73 L 11 -48" stroke-width="15" />
        <path d="M 4 -67 L 24 -48 M 24 -67 L 4 -48" stroke-width="13" />
      </g>

      <!-- Main Crisp Pure White Bolder Rx Letterform -->
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -22 -98 L -22 -48 M -22 -98 L -2 -98 C 13 -98 13 -73 -2 -73 L -22 -73 M -4 -73 L 11 -48" stroke-width="10.5" />
        <path d="M 4 -67 L 24 -48 M 24 -67 L 4 -48" stroke-width="8.5" />
      </g>
    </g>
  </g>
</svg>
